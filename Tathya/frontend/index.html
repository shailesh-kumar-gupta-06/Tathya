<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tathya – Don’t guess. Verify.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-name">Tathya</span><span class="brand-dev" lang="hi">तथ्य</span><span class="brand-tag">Don’t guess. Verify.</span></div>
  <div id="modePill" class="pill" role="status"></div>
</header>

<div class="shell">
  <aside class="docs" aria-label="Documents">
    <h2>Documents</h2>
    <label class="drop" id="drop">
      <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
      <strong>Add PDFs</strong>
      <span>Drop files here or click to choose. PDF only, up to 20 MB each.</span>
    </label>
    <button class="btn ghost" id="sampleBtn" type="button" hidden>Load sample documents</button>
    <ul id="docList" class="doclist"></ul>
    <p id="docEmpty" class="muted">No documents yet. Add at least one PDF to start asking.</p>
    <p class="muted small" id="docCount"></p>
  </aside>

  <main>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="ask">Ask</button>
      <button role="tab" aria-selected="false" data-view="conflicts">Conflicts</button>
      <button role="tab" aria-selected="false" data-view="amendments">Amendments</button>
    </nav>

    <section id="view-ask" class="view">
      <div id="thread" class="thread" aria-live="polite">
        <div class="intro" id="intro">
          <h1>Ask across your documents. Get proof, not guesses.</h1>
          <p>Every answer comes with the document, page and exact quote behind it. If the files don’t contain the proof, Tathya says so.</p>
          <div class="chips" id="chips"></div>
        </div>
      </div>
      <form id="askForm" class="ask" autocomplete="off">
        <label for="q" class="sr">Your question</label>
        <input id="q" type="text" placeholder="e.g. What is the applicable interest rate?" required>
        <button class="btn" id="askBtn" type="submit">Verify answer</button>
      </form>
    </section>

    <section id="view-conflicts" class="view" hidden><div id="conflictsBox"></div></section>
    <section id="view-amendments" class="view" hidden><div id="amendBox"></div></section>
  </main>
</div>

<div id="toast" class="toast" role="alert" hidden></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
